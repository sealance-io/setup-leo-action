# =============================================================================
# Dependabot Configuration
# =============================================================================
#
# Automatically checks for updates to:
# - GitHub Actions (weekly)
#
# SHA-pinned actions are updated while preserving the version comment.
# Example:
#   Before: uses: actions/cache@abc123 # v4.2.0
#   After:  uses: actions/cache@def456 # v4.2.1
#
# WHY USE DEPENDABOT FOR ACTIONS?
# -------------------------------
# 1. Security: Get notified of action updates (including security fixes)
# 2. Convenience: Automatic PRs with changelog
# 3. Safety: PRs allow review before merging
#
# IMPORTANT: Always review Dependabot PRs before merging.
# The tj-actions compromise showed that even "update" PRs can be vectors
# if the upstream is compromised.
#
# =============================================================================

version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Use cron instead of interval: "daily" because GitHub's "daily"
      # schedule only runs on weekdays. This runs every day at 09:00 UTC.
      interval: "cron"
      cronjob: "0 9 * * *"
      timezone: "UTC"

    # Delay newly released action versions for 7 days before opening PRs.
    # This reduces exposure to compromised upstream releases, while still
    # allowing Dependabot security updates to bypass the cooldown.
    cooldown:
      default-days: 7
      include:
        - "*"
    
    # Group all action updates into single PR
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    
    # Limit open PRs
    open-pull-requests-limit: 5
    
    # Dependabot adds "(deps)" when include: "scope" is enabled, so keep the
    # prefix bare to avoid duplicated titles like "chore(deps)(deps): ...".
    commit-message:
      prefix: "chore"
      include: "scope"
    
    # Labels for PRs
    labels:
      - "dependencies"
      - "github-actions"
    
    reviewers:
      - "@sealance-io/sealance-engineers"
