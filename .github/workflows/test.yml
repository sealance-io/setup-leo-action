# =============================================================================
# CI for setup-leo-action
# =============================================================================
#
# Tests the action itself to ensure it works correctly.
# Run on:
# - Push to main (test + save cache)
# - Pull requests (test only)
# - Weekly schedule (keep caches fresh)
#
# =============================================================================

name: Test Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  LEO_VERSION: "4.2.0"  # Default Leo version to test with

jobs:
  # ===========================================================================
  # Test on Linux
  # ===========================================================================
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Test action
        id: setup-leo
        uses: ./
        with:
          version: ${{ env.LEO_VERSION }}
          cache-save: ${{ github.event_name == 'pull_request' && 'never' || 'always' }}
          run-audit: 'true'
      
      - name: Verify outputs
        env:
          LEO_VER: ${{ steps.setup-leo.outputs.leo-version }}
          CACHE_HIT_BINARY: ${{ steps.setup-leo.outputs.cache-hit-binary }}
          CACHE_HIT_CARGO: ${{ steps.setup-leo.outputs.cache-hit-cargo }}
          BUILD_TIME: ${{ steps.setup-leo.outputs.build-time-seconds }}
        run: |
          echo "Version: ${LEO_VER}"
          echo "Binary cache hit: ${CACHE_HIT_BINARY}"
          echo "Cargo cache hit: ${CACHE_HIT_CARGO}"
          echo "Build time: ${BUILD_TIME}s"
      
      - name: Verify Leo works
        run: |
          leo --version
          leo --help
      
      - name: Test with sample project
        run: |
          mkdir -p test-project
          cd test-project
          leo new hello_world
          cd hello_world
          leo build
          leo test

      - name: Test with sample library (Leo v4+)
        run: |
          LEO_MAJOR=$(leo --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 | cut -d. -f1)
          if [[ "${LEO_MAJOR}" -lt 4 ]]; then
            echo "Skipping v4-only library smoke test for Leo ${LEO_MAJOR}.x"
            exit 0
          fi

          mkdir -p test-library
          cd test-library
          leo new --library math_utils
          cd math_utils
          test -f src/lib.leo
          leo build

  # ===========================================================================
  # Test on macOS ARM64
  # ===========================================================================
  test-macos-arm:
    name: Test (macOS ARM64)
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Test action
        uses: ./
        with:
          version: ${{ env.LEO_VERSION }}
          cache-save: ${{ github.event_name == 'pull_request' && 'never' || 'always' }}

      - name: Verify Leo works
        run: |
          leo --version
          which leo

  # ===========================================================================
  # Test on macOS x86
  # ===========================================================================
  test-macos-x86:
    name: Test (macOS x86)
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Test action
        uses: ./
        with:
          version: ${{ env.LEO_VERSION }}
          cache-save: ${{ github.event_name == 'pull_request' && 'never' || 'always' }}

      - name: Verify Leo works
        run: leo --version

  # ===========================================================================
  # Test cache behavior
  # ===========================================================================
  test-cache:
    name: Test Cache Behavior
    runs-on: ubuntu-24.04
    needs: [test-linux]  # Run after first test to check cache was created
    if: github.event_name != 'pull_request'  # Only on main (PRs don't save cache)
    timeout-minutes: 45
    permissions:
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Test action (should hit cache)
        id: setup-leo
        uses: ./
        with:
          version: ${{ env.LEO_VERSION }}
          cache-save: 'never'  # Don't save, just restore
      
      - name: Verify cache was hit
        env:
          CACHE_HIT_BINARY: ${{ steps.setup-leo.outputs.cache-hit-binary }}
          BUILD_TIME: ${{ steps.setup-leo.outputs.build-time-seconds }}
        run: |
          if [[ "${CACHE_HIT_BINARY}" != "true" ]]; then
            echo "::warning::Binary cache miss - expected hit after test-linux job"
          fi

          # Build time should be 0 or very low if cache hit
          echo "Build time: ${BUILD_TIME}s"

  # ===========================================================================
  # Test Leo versions with compatible Rust toolchains
  # ===========================================================================
  # Rust versions are from each release's rust-toolchain.toml:
  # https://github.com/ProvableHQ/leo/blob/<tag>/rust-toolchain.toml
  # ===========================================================================
  test-leo-versions:
    name: Test (Leo ${{ matrix.leo }} / Rust ${{ matrix.rust }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # New default version - also test with stable Rust
          - leo: "4.2.0"
            rust: "stable"
          # leo-lang-v4.2.0 requires Rust 1.96.0
          - leo: "4.2.0"
            rust: "1.96.0"
          # leo-lang-v4.1.0 requires Rust 1.96.0
          - leo: "4.1.0"
            rust: "1.96.0"
          # v4.0.0 requires Rust 1.94.1 and exercises legacy v-tag fallback
          - leo: "4.0.0"
            rust: "1.94.1"
          # v3.5.0 requires Rust 1.92.0
          - leo: "3.5.0"
            rust: "1.92.0"
          # v3.4.0 requires Rust 1.90.0
          - leo: "3.4.0"
            rust: "1.90.0"

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Test action with Leo ${{ matrix.leo }} / Rust ${{ matrix.rust }}
        uses: ./
        with:
          version: ${{ matrix.leo }}
          rust-version: ${{ matrix.rust }}
          cache-save: 'never'  # Don't pollute cache with multiple versions

      - name: Verify
        env:
          EXPECTED_VERSION: ${{ matrix.leo }}
        run: |
          leo --version
          # Verify version matches expected
          leo --version | grep -q "${EXPECTED_VERSION}" || echo "::warning::Version mismatch"

  # ===========================================================================
  # Lint and Security Analysis
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install lint dependencies
        run: |
          # GitHub-hosted runners already include ShellCheck and Go.
          # Only python3-yaml and act-missing tools need explicit install.
          PACKAGES=()

          if ! python3 -c "import yaml" 2>/dev/null; then
            PACKAGES+=(python3-yaml)
          fi

          # Fallbacks for act (local testing) where runner tools may be absent.
          if ! command -v shellcheck &>/dev/null; then
            PACKAGES+=(shellcheck)
          fi

          if ! command -v go &>/dev/null; then
            PACKAGES+=(golang-go)
          fi

          if [[ "${#PACKAGES[@]}" -gt 0 ]]; then
            if command -v sudo &>/dev/null; then
              SUDO="sudo"
            else
              SUDO=""
            fi

            ${SUDO} apt-get update
            ${SUDO} apt-get install -y "${PACKAGES[@]}"
          fi

      - name: Lint scripts
        run: |
          shopt -s nullglob
          scripts=(scripts/*.sh)

          if [[ "${#scripts[@]}" -eq 0 ]]; then
            echo "No shell scripts to lint"
            exit 0
          fi

          shellcheck "${scripts[@]}"

      - name: Validate action.yml
        run: |
          # Basic YAML validation
          python3 -c "import yaml; yaml.safe_load(open('action.yml'))"
          echo "action.yml is valid YAML"

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: "1.7.8"
        run: |
          ACTIONLINT_BIN="$(command -v actionlint || true)"

          if [[ -n "${ACTIONLINT_BIN}" ]] && "${ACTIONLINT_BIN}" -version 2>/dev/null | grep -q "v${ACTIONLINT_VERSION}"; then
            echo "Using preinstalled actionlint ${ACTIONLINT_VERSION}"
          else
            mkdir -p "${RUNNER_TEMP}/actionlint-bin"
            GOBIN="${RUNNER_TEMP}/actionlint-bin" go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
            ACTIONLINT_BIN="${RUNNER_TEMP}/actionlint-bin/actionlint"
          fi

          "${ACTIONLINT_BIN}" -color

      - name: Run zizmor security analysis
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          version: v1.23.1
          advanced-security: false
          min-severity: medium
          inputs: .github/workflows/ action.yml
